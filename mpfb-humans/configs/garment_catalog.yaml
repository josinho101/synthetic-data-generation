# -----------------------------------------------------------------------------
# Garment catalogue: stable IDs for the installed MPFB / MakeHuman clothes assets.
# clothing.yaml slots can name a garment by ID (`garment: L06`) instead of `asset:` / `mpfb_slot:`.
# Visual check: scripts/garment_catalog.py renders every entry onto reference humans.
#
#   category: upper | lower | full (one mesh for top + bottom) | shoes | hat
#   sex:      who it is rendered on / fits (male | female | any)
#   rating:   A realistic, PBR maps (normal / specular / AO)
#             B plausible, diffuse-only or low-res (looks flatter)
#             C low quality (very low poly, "crude")
#             X costume / fantasy / print or logo: not for clinical SDG
#   maps:     texture maps of the asset (D diffuse, N normal, S specular, AO, B bump) and their size
# Ratings: from metadata, then corrected after the rendered catalogue (output/garment_catalog, 2026-10-26).
# Shoe renders show the asset's own socks (S01-S04, S24-S29).
# -----------------------------------------------------------------------------

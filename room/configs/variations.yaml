# -----------------------------------------------------------------------------
# WHAT gets generated: how many rooms, the seed and the weights of every categorical choice.
# Weight blocks are relative weights (they do not need to sum to 100). Ranges are [min, max].
# The exact values used for each room are written to manifest.json and <id>.json.
# -----------------------------------------------------------------------------
count: 1                        # number of rooms to generate
seed: 20261020                  # global seed -> every room gets a derived, stable seed
id_prefix: "R"                  # room ids: R0001, R0002, ...
id_digits: 4
max_layout_attempts: 50         # a room whose layout cannot be solved is resampled (new sub-seed) this many times

# Layout randomization. false: every room gets the SAME layout (room height, check-in room and doors, detector side,
# equipment geometry, SID, table / stretcher, props and their positions, light panels, cameras); only the appearance
# changes per room (wall / floor finish and colours, door and equipment colours, tape colour, CCT, lux).
# true: every room also gets its own layout. layout_seed picks which fixed layout (null = `seed`).
randomize_layout: false
layout_seed: null

# Detector (wall bucky) wall, seen from the entrance end of the room looking into the room (+X):
#   left = north wall (y = width), right = south wall (y = 0). The tube rail goes on the other long wall.
detector_side: {left: 50, right: 50}   # used only with equipment.wall_stand.wall: sampled

# The check-in / changing room is OUTSIDE the X-ray room, against its entrance-end wall (x < 0), in the
# north (y = width) or south (y = 0) corner. The patient enters the check-in room from the corridor, then
# walks into the X-ray room through the connecting door in the shared wall (the only way in).
changing_room_corner: {north: 50, south: 50}

# Entrance = outer door of the check-in room (from the corridor): on its west wall, or on its outer side wall
# (in line with the X-ray room's north / south wall). Falls back to the other wall when it does not fit.
entrance_wall: {west: 60, side: 40}

wall_finish: {white: 35, beige: 25, gray: 25, tiled: 15}
floor_material: {vinyl: 45, tile: 35, concrete: 20}

# Light colour temperature class -> K is drawn uniformly inside the class range (lighting.yaml)
cct_class: {warm: 25, neutral: 45, cool: 30}

# Table / stretcher in the exam area (at most one of them)
patient_support: {none: 40, table: 30, stretcher: 30}

# Tube column: floor-mounted only, or floor-to-ceiling column with a ceiling guide rail
tube_column_type: {floor: 60, floor_ceiling: 40}

# -----------------------------------------------------------------------------
# Clothing variants. Each variant = percentage + slots.
# A slot is either:
#   asset:     fixed MHCLO path (relative to the project's assets/ dir, or absolute)
#   mpfb_slot: keyword pick from installed MPFB clothes packs, same semantics as
#              MPFB's randomization clothes slots:
#                chance (0-100), include_any, include_male, include_female, exclude, pack
#              (comma separated, case-insensitive substrings of the asset name)
# -----------------------------------------------------------------------------
# Footwear by sex (MPFB pack names). Professional outfits use formal shoes; gowns use
# comfortable shoes / flats.
_formal_shoes: &formal_shoes
  include_male: "mindfront_shoes_oxford_male,mindfront_shoes_monk_strap_male,callharvey3d_harvey_saddleshoes1"
  include_female: "mindfront_shoes_oxford_female,mindfront_shoes_monk_strap_female,dressupdoc_balletflat1,dressupdoc_maryjane1,elvs_flatshoe_plain1"
_comfort_shoes: &comfort_shoes
  include_male: "punkduck_comfortable_sneakers,culturalibre_sneakers,punkduck_tennis_shoes"
  include_female: "dressupdoc_balletflat1,elvs_flatshoe_plain1,elvs_flatshoe_buckle_1,punkduck_comfortable_sneakers"

variants:
  gown:                                     # generated hospital gown (knee length, short sleeve)
    pct: 25
    slots:
      full_body: {asset: custom/hospital_gown/gown_standard.mhclo}
      feet:      {mpfb_slot: *comfort_shoes}
  gown_long_sleeve:
    pct: 10
    slots:
      full_body: {asset: custom/hospital_gown/gown_long_sleeve.mhclo}
      feet:      {mpfb_slot: *comfort_shoes}
  gown_with_pants:
    pct: 5
    slots:
      full_body:  {asset: custom/hospital_gown/gown_short.mhclo}
      lower_body: {mpfb_slot: {include_male: "mindfront_male_trousers_1,toigo_wool_pants", include_female: "mindfront_female_trousers_1,toigo_wool_pants"}}
      feet:       {mpfb_slot: *comfort_shoes}
  business:                                 # shirt / blouse + trousers or skirt + formal shoes
    pct: 35
    slots:
      upper_body: {mpfb_slot: {include_male: "namuhekam_male_polo_shirt,elvs_male_shirt_untucked_bd1",
                               include_female: "punkduck_lace_up_blouse,toigo_basic_tucked_t-shirt"}}
      lower_body: {mpfb_slot: {include_male: "toigo_wool_pants,mindfront_male_trousers_1,mindfront_male_trousers_2",
                               include_female: "toigo_skirt_with_lace_ruffle,toigo_long_full_skirt,mindfront_female_trousers_1,toigo_wool_pants"}}
      feet:       {mpfb_slot: *formal_shoes}
  suit:                                     # MakeHuman system suits (one full-body garment) + formal shoes
    pct: 15
    slots:
      full_body: {mpfb_slot: {include_male: "male_elegantsuit01,male_casualsuit06",
                              include_female: "female_elegantsuit01,female_casualsuit01,female_casualsuit02"}}
      feet:      {mpfb_slot: *formal_shoes}
  smart_casual:                             # sweater / cardigan + trousers or skirt + formal shoes
    pct: 10
    slots:
      upper_body: {mpfb_slot: {include_male: "mindfront_knitted_sweater_01,namuhekam_male_polo_shirt",
                               include_female: "mindfront_knitted_sweater_02,mindfront_cardigan_long_open_front"}}
      lower_body: {mpfb_slot: {include_male: "mindfront_male_trousers_1,toigo_wool_pants",
                               include_female: "toigo_skirt_with_lace_ruffle,mindfront_female_trousers_1,toigo_wool_pants"}}
      feet:       {mpfb_slot: *formal_shoes}

mpfb_packs: []                  # optional: only pick mpfb_slot assets from these pack names

# Gown fabric: colour + pattern ("stripes" = coloured vertical stripes on base_rgb, like the
# classic hospital gown; "solid" = whole gown in rgb). Sleeve trim always stays base_rgb.
gown_colors:
  red_stripes:  {pct: 35, rgb: "#d24a5f", pattern: stripes, base_rgb: "#f6f3ee"}
  blue_stripes: {pct: 25, rgb: "#4f79b8", pattern: stripes, base_rgb: "#f6f3ee"}
  light_blue:   {pct: 20, rgb: "#a9c8e8", pattern: solid,   base_rgb: "#f6f3ee"}
  green:        {pct: 10, rgb: "#9fcfb4", pattern: solid,   base_rgb: "#f6f3ee"}
  white:        {pct: 10, rgb: "#f2f2ee", pattern: solid,   base_rgb: "#f6f3ee"}

gown_thickness_cm: 0.3          # solidify thickness added at build time (double-sided look in Isaac Sim)

# MHCLO fitting follows each body's surface; these build-time modifiers relax the fitted
# gown so it drapes instead of showing body detail (applied before USD export).
gown_shaping:
  smooth_iterations: 4          # Smooth modifier repeat (0 = off)
  smooth_factor: 0.5
  inflate_cm: 0.5               # push outward along normals after smoothing
  weight_smooth_iterations: 15  # blend skin weights over the lower gown (natural sway; 0 = off)
  weight_smooth_below: 0.6      # ... for the lower 60 % of the gown height
  edge_rings: 3                 # smoothing fades out over this many edge rings next to cut edges
subdiv_levels: 0
remove_hidden_body_faces: false # keep full body mesh under clothes (landmarks need the back surface)
garment_texture_max_px: 1024   # MPFB garment colours are baked to textures of at most this size
layer_offset_cm: 0.5            # outer garment of a top + bottom pair is pushed out by this (no poke-through)
hide_body_under: [feet]         # body vertices inside these garments are removed at export (no feet poking through shoes)

# What to do when a slot cannot be satisfied (missing file / no matching pack asset):
#   skip_slot : log a WARNING and continue without that piece
#   error     : fail the human
fallback_if_missing: skip_slot

# Used when a variant ends up with no garment at all (e.g. mpfb_casual without clothes packs),
# so nobody is generated unclothed.
fallback_variant: gown

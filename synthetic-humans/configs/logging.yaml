# -----------------------------------------------------------------------------
# Python logging (logging.config.dictConfig format).
# "{run_dir}" is replaced with the current run directory at start-up.
# Default level is INFO everywhere. For troubleshooting set the file handlers, root and
# worker_level to DEBUG (solver iterations, asset choices, per-target details).
# -----------------------------------------------------------------------------
keep_last_runs: 20              # central copies in synthetic-humans/logs/ (older ones are deleted)
worker_level: INFO              # level of per-human Blender logs (DEBUG for troubleshooting) (<run>/logs/humans/<id>.log)
worker_format: "%(asctime)s | %(levelname)-8s | %(name)s:%(lineno)d | %(message)s"

dict_config:
  version: 1
  disable_existing_loggers: false
  formatters:
    detailed:
      format: "%(asctime)s | %(levelname)-8s | %(threadName)s | %(name)s:%(lineno)d | %(message)s"
    console:
      format: "%(message)s"
  handlers:
    console:
      class: logging.StreamHandler
      level: INFO
      formatter: console
      stream: ext://sys.stdout
    run_file:
      class: logging.FileHandler
      level: INFO
      formatter: detailed
      filename: "{run_dir}/logs/pipeline.log"
      encoding: utf-8
    errors:
      class: logging.FileHandler
      level: ERROR
      formatter: detailed
      filename: "{run_dir}/logs/errors.log"
      encoding: utf-8
  root:
    level: INFO
    handlers: [console, run_file, errors]

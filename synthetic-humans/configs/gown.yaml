# -----------------------------------------------------------------------------
# Hospital gown generator (scripts/make_gown.py). Produces MPFB clothes assets
# (.mhclo + .obj + .mhmat) that fit every generated body automatically.
#
# Construction: upper shell cut from the body's own torso / upper-arm faces (natural
# shoulders, round neckline, short sleeves with a trim band) + a draped lower part that
# falls straight from chest and hips to the knee. The shell covers the top of the drape
# like a yoke seam. Open back with ties.
# -----------------------------------------------------------------------------
output_dir: assets/custom/hospital_gown     # relative to synthetic-humans/

variants:
  gown_standard:    {length: knee,      sleeve: short, looseness_cm: 2.0, back_opening: true}
  gown_long_sleeve: {length: knee,      sleeve: elbow, looseness_cm: 2.0, back_opening: true}
  gown_short:       {length: mid_thigh, sleeve: short, looseness_cm: 2.0, back_opening: true}
  # knee-length office (pencil) skirt for women: waist -> knee, straight fall below the hips
  office_skirt:     {type: skirt, length: knee, looseness_cm: 0.8, waist_above_hip_cm: 10.0, taper_cm_per_m: 2.0}

# Hem height as a fraction from the hip joint (0) to the knee joint (1)
lengths: {mid_thigh: 0.5, knee: 1.0, above_knee: 0.9}

# --- upper shell (shoulders, neckline, sleeves) ---
sleeve_ends: {short: 0.5, elbow: 1.0}      # fraction along the upper arm (shoulder joint 0 -> elbow 1)
sleeve_widen_cm: 2.0            # extra sleeve width towards the sleeve end (loose sleeve opening)
sleeve_trim_fraction: 0.12      # last part of the sleeve mapped to the white trim band
neckline_drop_front_cm: 4.0     # round neckline below the neck joint at the front ...
neckline_drop_back_cm: 2.0      # ... and at the back
shell_smooth_iterations: 12     # smoothing of the shell (hides body detail)
seam_below_armpit_cm: 12.0      # shell reaches this far below the armpits (yoke seam)
seam_cover_cm: 0.4              # shell lies this far outside the drape where they overlap

# --- lower drape ---
armpit_drop_cm: 7.0             # armpit level below the shoulder joints
tube_top_below_armpit_cm: 3.0   # drape starts this far below the armpits (hidden under the shell)
flare_cm_per_m: 6.0             # A-line: extra radius per metre down from the drape top
segments_around: 64
ring_spacing_cm: 1.5

# --- back ---
back_opening_width_cm: 4.0      # open strip below the armpits (shoulders stay closed)
tie_heights: [0.35, 0.65]       # bow ties: fraction from the shoulders (0) to the hips (1)

stripe_repeats_around: 16       # texture tiles around the body (4 stripes per tile)
texture_size: 512
author: "synthetic-humans"
license: "CC0"
